<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chi tiết sản phẩm</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style3.css">
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom mb-4">
    <div class="container">
      <a class="navbar-brand" href="../index.html">Flower Shop</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="../index.html">Trang Chủ</a></li>
          <li class="nav-item"><a class="nav-link" href="page1.html">Thông Tin Cá Nhân</a></li>
          <li class="nav-item"><a class="nav-link" href="page2.html">Đăng Nhập</a></li>
          <li class="nav-item"><a class="nav-link" href="page3.html">Phiếu Đăng Ký CLB</a></li>
          <li class="nav-item"><a class="nav-link" href="page4.html">Xuất Hóa Đơn</a></li>
          <li class="nav-item"><a class="nav-link" href="page5.html">Bảng Cửu Chương</a></li>
          <li class="nav-item"><a class="nav-link" href="page6.html">Danh Sách Sản Phẩm</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container pb-5">
    <div id="product-detail" class="row justify-content-center"></div>
  </div>

  <script src="../js/lib.js"></script>
  <script>
    function getQueryParam(name) {
      const params = new URLSearchParams(window.location.search);
      return params.get(name);
    }

    function renderProductDetail(product) {
      if (!product) {
        document.getElementById('product-detail').innerHTML =
          '<div class="col-12"><div class="alert alert-warning">Sản phẩm không tồn tại.</div></div>';
        return;
      }

      document.getElementById('product-detail').innerHTML = `
        <div class="col-12 col-lg-8">
          <div class="card mb-4 shadow-sm">
            <img src="${product.image}" alt="${product.name}" class="card-img-top" style="height: 420px; object-fit: cover;">
            <div class="card-body">
              <h2 class="card-title">${product.name}</h2>
              <p class="text-danger fs-4 fw-bold">${product.price}/túi</p>
              <p class="text-muted">Mã sản phẩm: <strong>${product.id}</strong></p>
              <p class="mb-2"><strong>Mô tả:</strong> ${product.description || 'Chưa có mô tả.'}</p>
              <p class="mb-4"><strong>Xuất xứ:</strong> ${product.origin || 'Chưa xác định.'}</p>
              <p>Đây là trang chi tiết mẫu cho sản phẩm. Bạn có thể thêm mô tả, thông tin kích thước, nguyên liệu hoặc hướng dẫn mua hàng ở đây.</p>
              <a href="page6.html" class="btn btn-outline-primary">Quay lại danh sách</a>
            </div>
          </div>
        </div>
      `;
    }

    const productId = getQueryParam('id');
    const product = getProductById(productId);
    renderProductDetail(product);
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
